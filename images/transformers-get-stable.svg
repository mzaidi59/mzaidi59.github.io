<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="460" fill="#fcfcfa"/>

  <!-- Title -->
  <text x="30" y="38" font-size="19" font-weight="600" fill="#1b1b1a">Signal variance vs. network depth</text>
  <text x="30" y="60" font-size="13" fill="#5c5d5a">Forward-pass output variance across transformer layers</text>

  <!-- Plot area -->
  <g>
    <!-- axes -->
    <line x1="90" y1="380" x2="850" y2="380" stroke="#1b1b1a" stroke-width="1.4"/>
    <line x1="90" y1="90" x2="90" y2="380" stroke="#1b1b1a" stroke-width="1.4"/>

    <!-- gridlines -->
    <line x1="90" y1="235" x2="850" y2="235" stroke="#dfded8" stroke-width="1"/>
    <line x1="90" y1="90" x2="850" y2="90" stroke="#dfded8" stroke-width="1"/>

    <!-- axis labels -->
    <text x="470" y="418" font-size="14" fill="#5c5d5a" text-anchor="middle">Layer depth</text>
    <text x="40" y="235" font-size="14" fill="#5c5d5a" text-anchor="middle" transform="rotate(-90 40 235)">Output signal variance</text>

    <!-- depth ticks -->
    <text x="90"  y="398" font-size="11" fill="#5c5d5a" text-anchor="middle">0</text>
    <text x="280" y="398" font-size="11" fill="#5c5d5a" text-anchor="middle">250</text>
    <text x="470" y="398" font-size="11" fill="#5c5d5a" text-anchor="middle">500</text>
    <text x="660" y="398" font-size="11" fill="#5c5d5a" text-anchor="middle">750</text>
    <text x="850" y="398" font-size="11" fill="#5c5d5a" text-anchor="middle">1000</text>

    <!-- Standard init: exploding curve -->
    <path d="M90,340 C 250,330 350,300 430,240 C 500,185 560,120 610,80"
          fill="none" stroke="#b3593f" stroke-width="2.6"/>
    <!-- Standard init: vanishing curve (alternate failure mode), dashed -->
    <path d="M90,340 C 250,352 350,368 470,376 C 600,381 720,383 850,384"
          fill="none" stroke="#b3593f" stroke-width="2.2" stroke-dasharray="6 5"/>

    <!-- DeepScaleLM: stable flat line -->
    <path d="M90,300 L850,300" fill="none" stroke="#2d5a7b" stroke-width="3"/>

    <!-- marker where standard init leaves the plot (instability) -->
    <circle cx="610" cy="80" r="4.5" fill="#b3593f"/>
    <text x="618" y="72" font-size="11.5" fill="#b3593f">gradients explode →</text>

    <circle cx="850" cy="384" r="4.5" fill="#b3593f"/>
    <text x="700" y="400" font-size="0" fill="#b3593f"></text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#1b1b1a">
    <line x1="600" y1="130" x2="630" y2="130" stroke="#2d5a7b" stroke-width="3"/>
    <text x="638" y="134">DeepScaleLM (ours) — stable</text>

    <line x1="600" y1="155" x2="630" y2="155" stroke="#b3593f" stroke-width="2.6"/>
    <text x="638" y="159">Standard init — exploding</text>

    <line x1="600" y1="180" x2="630" y2="180" stroke="#b3593f" stroke-width="2.2" stroke-dasharray="6 5"/>
    <text x="638" y="184">Standard init — vanishing</text>
  </g>

  <!-- Caption -->
  <text x="30" y="445" font-size="12" fill="#5c5d5a">Without correction, signal moments drift with depth, causing rank collapse or saturation. DeepScaleLM's initialization keeps moments constant, enabling stable training up to 1000 layers.</text>
</svg>
